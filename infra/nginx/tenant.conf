# Nginx reverse proxy for tenant org subdomains (pre-SSL)
# Handles https://<org>.digitalchain.in by proxying to the Admin Portal
# Notes:
# - This is an HTTP-only server block intended for initial setup and ACME challenges.
# - For HTTPS, either issue a wildcard cert (*.digitalchain.in) using DNS challenge,
#   or issue individual certificates per org subdomain and create corresponding
#   server blocks listening on 443.

server {
    listen 80;
    listen [::]:80;
    # Regex captures the first label as the org slug (e.g., jugesh.digitalchain.in => jugesh)
    server_name ~^(?<org>[^\.]+)\.digitalchain\.in$;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy all requests to the Admin Portal (Next.js) running on localhost:3000
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Also forward resolved org slug explicitly so the app/backend can key on it if desired
        proxy_set_header X-Org $org;
        proxy_pass http://127.0.0.1:3000;
    }
}
