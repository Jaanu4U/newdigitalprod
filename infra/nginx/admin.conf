# Nginx reverse proxy for Digitalchain Admin Portal (pre-SSL)
# Certbot will create the HTTPS server block automatically.
server {
    listen 80;
    listen [::]:80;
    server_name admin.digitalchain.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS after certificates are installed
    location / {
        return 301 https://$host$request_uri;
    }
}
