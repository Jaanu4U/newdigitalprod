# Nginx reverse proxy for apex domain (pre-SSL)
# Serves https://digitalchain.in (SuperAdmin UI lives here)

server {
    listen 80;
    listen [::]:80;
    server_name digitalchain.in www.digitalchain.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS after certs are installed by certbot
    location / {
        return 301 https://$host$request_uri;
    }
}
