# Nginx reverse proxy for Digitalchain API (pre-SSL)
# Certbot will create the HTTPS server block automatically.
server {
    listen 80;
    listen [::]:80;
    server_name api.digitalchain.in;

    # ACME challenge location for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all traffic to HTTPS once certificates are installed
    location / {
        return 301 https://$host$request_uri;
    }
}
